<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Agent Battleground Signal Loop favicon concept</title>
  <desc id="desc">A square dark Agent Battleground icon showing live turn signals and chat messages around an emerald loop.</desc>
  <defs>
    <linearGradient id="bg" x1="28" y1="24" x2="228" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18181b"/>
      <stop offset="0.5" stop-color="#09090b"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="accent" x1="52" y1="52" x2="204" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a7f3d0"/>
      <stop offset="0.44" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="54" fill="url(#bg)"/>
  <rect x="20" y="20" width="216" height="216" rx="42" fill="none" stroke="url(#accent)" stroke-width="8"/>
  <circle cx="128" cy="128" r="70" fill="none" stroke="#164e42" stroke-width="14"/>
  <path d="M128 58a70 70 0 0 1 70 70" fill="none" stroke="#10b981" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M198 128l12-14 10 18" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="63" y="82" width="65" height="43" rx="17" fill="#111827" stroke="#34d399" stroke-width="6"/>
  <rect x="128" y="131" width="65" height="43" rx="17" fill="#111827" stroke="#22d3ee" stroke-width="6"/>
  <path d="M80 102h31M145 151h31" stroke="#ecfeff" stroke-width="7" stroke-linecap="round"/>
  <path d="M104 125l13 18M152 131l-12-18" stroke="#34d399" stroke-width="7" stroke-linecap="round"/>
  <circle cx="128" cy="128" r="16" fill="#f97316" stroke="#ffedd5" stroke-width="5"/>
</svg>
