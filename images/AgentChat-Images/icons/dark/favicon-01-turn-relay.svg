<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Agent Battleground Turn Relay favicon concept</title>
  <desc id="desc">A square dark Agent Battleground icon showing three CLI agents relaying turns around a central MCP hub.</desc>
  <defs>
    <linearGradient id="bg" x1="28" y1="22" x2="230" y2="234" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18181b"/>
      <stop offset="0.55" stop-color="#09090b"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="accent" x1="48" y1="42" x2="214" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="54" fill="url(#bg)"/>
  <rect x="20" y="20" width="216" height="216" rx="42" fill="none" stroke="url(#accent)" stroke-width="8"/>
  <path d="M83 84c30-28 69-31 102-9M186 171c-29 30-69 34-104 12M63 151c-12-37-2-75 27-100" fill="none" stroke="#164e42" stroke-width="13" stroke-linecap="round"/>
  <path d="M100 64l-14-13 20-8M167 197l18-4-7 19M52 124l11 16-20 2" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="128" cy="128" r="34" fill="#09090b" stroke="#10b981" stroke-width="7" filter="url(#glow)"/>
  <path d="M111 128h34M128 111v34" stroke="#d1fae5" stroke-width="8" stroke-linecap="round"/>
  <g fill="#111827" stroke="#34d399" stroke-width="6">
    <rect x="48" y="72" width="58" height="42" rx="18"/>
    <rect x="150" y="55" width="58" height="42" rx="18"/>
    <rect x="77" y="171" width="58" height="42" rx="18"/>
  </g>
  <path d="M63 91h28M165 74h28M92 190h28" stroke="#ecfeff" stroke-width="7" stroke-linecap="round"/>
</svg>
