<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Agent Battleground Signal Loop landscape logo concept</title>
  <desc id="desc">A wide Agent Battleground wordmark with a signal-loop mark for GitHub and website headers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
