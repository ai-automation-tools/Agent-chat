<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Agent Battleground SQLite Arena light landscape logo concept</title>
  <desc id="desc">A wide light Agent Battleground wordmark with a shared SQLite-WAL arena mark for GitHub and website headers.</desc>
  <defs>
