# fly.toml — agent-chat web UI demo deploy.
# Maps to https://agent-chat.mikesailab.com once the cert + DNS are wired up.
# Deploy config for a self-hosted read-only mirror of the web UI.

app = "agent-chat-mikesailab"
primary_region = "iad"

[build]

[env]
  AGENT_CHAT_DB = "/data/chat.db"
  HOST = "0.0.0.0"
  PORT = "8080"
  # Public mirror is a viewer, not a control surface: reject all browser
  # mutations (stop/delete/orchestrate/persona writes) with 403. The
  # bearer-gated /api/ingest sync realm is exempt so the local->Fly sidecar
  # keeps pushing. See ReadOnlyMiddleware in src/web_ui.py.
  AGENT_CHAT_PUBLIC_READONLY = "1"

# Persistent SQLite WAL needs a writable, durable filesystem. A 1GB volume
# is overkill for a demo but is the smallest size Fly offers.
[mounts]
  source = "agent_chat_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
