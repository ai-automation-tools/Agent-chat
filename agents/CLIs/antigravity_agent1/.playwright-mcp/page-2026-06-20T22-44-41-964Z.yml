        - 'heading "Antigravity Editor: MCP Integration" [level=1] [ref=e174]'
        - paragraph [ref=e176]: Antigravity supports the Model Context Protocol (MCP), a standard that allows the editor to securely connect to your local tools, databases, and external services. This integration provides the AI with real-time context beyond just the files open in your editor.
        - heading "What is MCP?" [level=2] [ref=e178]
        - paragraph [ref=e180]: MCP acts as a bridge between Antigravity and your broader development environment. Instead of manually pasting context (like database schemas or logs) into the editor, MCP allows Antigravity to fetch this information directly when needed.
        - heading "Core Features" [level=2] [ref=e182]
        - heading "1. Context Resources" [level=3] [ref=e184]
        - paragraph [ref=e186]: The AI can read data from connected MCP servers to inform its suggestions.
        - paragraph [ref=e188]:
          - strong [ref=e189]: "Example:"
          - text: When writing a SQL query, Antigravity can inspect your live Neon or Supabase schema to suggest correct table and column names.
        - paragraph [ref=e191]:
          - strong [ref=e192]: "Example:"
          - text: When debugging, the editor can pull in recent build logs from Netlify or Heroku.
        - heading "2. Custom Tools" [level=3] [ref=e194]
        - paragraph [ref=e196]: MCP enables Antigravity to execute specific, safe actions defined by your connected servers.
        - paragraph [ref=e198]:
          - strong [ref=e199]: "Example:"
          - text: "\"Create a Linear issue for this TODO.\""
        - paragraph [ref=e201]:
          - strong [ref=e202]: "Example:"
          - text: "\"Search Notion or GitHub for authentication patterns.\""
        - heading "How to Connect" [level=2] [ref=e204]
        - paragraph [ref=e206]: Connections are managed directly through the built-in MCP Store.
        - list [ref=e208]:
          - listitem [ref=e209]:
            - generic [ref=e210]:
              - strong [ref=e211]: "Access the Store:"
              - text: Open the MCP Store panel within the "..." dropdown at the top of the editor's side panel.
          - listitem [ref=e212]:
            - generic [ref=e213]:
              - strong [ref=e214]: "Browse & Install:"
              - text: Select any of the supported servers from the list and click Install.
          - listitem [ref=e215]:
            - generic [ref=e216]:
              - strong [ref=e217]: "Authenticate:"
              - text: Follow the on-screen prompts to securely link your accounts (where applicable).
        - paragraph [ref=e219]: Once installed, resources and tools from the server are automatically available to the editor.
        - heading "Connecting Custom MCP Servers" [level=2] [ref=e221]
        - paragraph [ref=e223]: "To connect to a custom MCP server:"
        - list [ref=e225]:
          - listitem [ref=e226]: Open the MCP store via the "..." dropdown at the top of the editor's agent panel.
          - listitem [ref=e227]: Click on "Manage MCP Servers"
          - listitem [ref=e228]: Click on "View raw config"
          - listitem [ref=e229]: Modify the mcp_config.json with your custom MCP server configuration.
        - paragraph [ref=e231]:
          - text: The configuration file is located at
          - code [ref=e232]: ~/.gemini/config/mcp_config.json
          - text: .
        - heading "Configuration Structure" [level=3] [ref=e234]
        - paragraph [ref=e236]:
          - text: The configuration file has a single
          - code [ref=e237]: mcpServers
          - text: object where you define each server you want to connect to.
        - generic [ref=e240]:
          - generic [ref=e242]: json
          - button "content_copy" [ref=e243] [cursor=pointer]
          - code [ref=e246]: "{ \"mcpServers\": { \"serverName\": { \"command\": \"path/to/executable\", \"args\": [ \"--arg1\", \"value1\" ], \"env\": { \"API_KEY\": \"your-api-key\" } } } }"
        - heading "Configuration Properties" [level=3] [ref=e248]
        - paragraph [ref=e250]: "Each server entry supports the following properties:"
        - paragraph [ref=e252]:
          - strong [ref=e253]: "Transport (one required):"
        - list [ref=e255]:
          - listitem [ref=e256]:
            - generic [ref=e257]:
              - strong [ref=e258]:
                - code [ref=e259]: command
              - text: "(string): Path to the executable for stdio transport."
          - listitem [ref=e260]:
            - generic [ref=e261]:
              - strong [ref=e262]:
                - code [ref=e263]: serverUrl
              - text: "(string): URL for remote servers for Streamable HTTP transport."
        - paragraph [ref=e265]:
          - strong [ref=e266]: "Optional:"
        - list [ref=e268]:
          - listitem [ref=e269]:
            - generic [ref=e270]:
              - strong [ref=e271]:
                - code [ref=e272]: args
              - text: "(string[]): Command-line arguments for stdio transport."
          - listitem [ref=e273]:
            - generic [ref=e274]:
              - strong [ref=e275]:
                - code [ref=e276]: env
              - text: "(object): Environment variables for the stdio server process."
          - listitem [ref=e277]:
            - generic [ref=e278]:
              - strong [ref=e279]:
                - code [ref=e280]: cwd
              - text: "(string): Working directory for stdio servers."
          - listitem [ref=e281]:
            - generic [ref=e282]:
              - strong [ref=e283]:
                - code [ref=e284]: headers
              - text: "(object): Custom HTTP headers for remote servers."
          - listitem [ref=e285]:
            - generic [ref=e286]:
              - strong [ref=e287]:
                - code [ref=e288]: authProviderType
              - text: "(string): Authentication provider. Supports"
              - code [ref=e289]: "\"google_credentials\""
              - text: for ADC.
          - listitem [ref=e290]:
            - generic [ref=e291]:
              - strong [ref=e292]:
                - code [ref=e293]: oauth
              - text: "(object): OAuth client credentials ("
              - code [ref=e294]: clientId
              - text: ","
              - code [ref=e295]: clientSecret
              - text: ).
          - listitem [ref=e296]:
            - generic [ref=e297]:
              - strong [ref=e298]:
                - code [ref=e299]: disabled
              - text: "(boolean): Temporarily disable a server without removing its configuration."
          - listitem [ref=e300]:
            - generic [ref=e301]:
              - strong [ref=e302]:
                - code [ref=e303]: disabledTools
              - text: "(string[]): Tool names to not provide to the model."
        - heading "Authentication" [level=2] [ref=e305]
        - heading "Google Credentials" [level=3] [ref=e307]
        - paragraph [ref=e309]:
          - text: Set
          - code [ref=e310]: authProviderType
          - text: to
          - code [ref=e311]: "\"google_credentials\""
          - text: to use Google Application Default Credentials (ADC).
        - generic [ref=e314]:
          - generic [ref=e316]: json
          - button "content_copy" [ref=e317] [cursor=pointer]
          - code [ref=e320]: "{ \"mcpServers\": { \"my-gcp-service\": { \"serverUrl\": \"https://example.googleapis.com/mcp/\", \"authProviderType\": \"google_credentials\" } } }"
        - paragraph [ref=e322]: "This requires Application Default Credentials to be configured. To set them up, run:"
        - generic [ref=e325]:
          - generic [ref=e327]: bash
          - button "content_copy" [ref=e328] [cursor=pointer]
          - code [ref=e331]: gcloud auth application-default login
        - heading "OAuth" [level=3] [ref=e333]
        - paragraph [ref=e335]: "Antigravity can automatically handle OAuth for servers that support dynamic client registration (DCR). For these servers, no additional configuration is needed:"
        - generic [ref=e338]:
          - generic [ref=e340]: json
          - button "content_copy" [ref=e341] [cursor=pointer]
          - code [ref=e344]: "{ \"mcpServers\": { \"oauth-server\": { \"serverUrl\": \"https://api.example.com/mcp/\" } } }"
        - paragraph [ref=e346]: "If the server does not support dynamic client registration, you can provide your client credentials manually:"
        - generic [ref=e349]:
          - generic [ref=e351]: json
          - button "content_copy" [ref=e352] [cursor=pointer]
          - code [ref=e355]: "{ \"mcpServers\": { \"oauth-server\": { \"serverUrl\": \"https://api.example.com/mcp/\", \"oauth\": { \"clientId\": \"your-client-id\", \"clientSecret\": \"your-client-secret\" } } } }"
        - paragraph [ref=e357]: "If you provided client credentials manually, ensure the following is registered as a redirect URI in your OAuth provider:"
        - generic [ref=e360]:
          - button "content_copy" [ref=e361] [cursor=pointer]
          - code [ref=e364]: https://antigravity.google/oauth-callback
        - paragraph [ref=e366]: "When connecting to an OAuth-enabled server:"
        - list [ref=e368]:
          - listitem [ref=e369]:
            - generic [ref=e370]:
              - text: Open
              - strong [ref=e371]: Agent Settings
              - text: with
              - code [ref=e372]: Cmd+,
              - text: (Mac) or
              - code [ref=e373]: Ctrl+,
              - text: (Windows/Linux).
          - listitem [ref=e374]:
            - generic [ref=e375]:
              - text: Navigate to the
              - strong [ref=e376]: Customizations
              - text: tab and click the
              - strong [ref=e377]: Authenticate
              - text: button next to the server.
        - img "Click Authenticate" [ref=e379]
        - list [ref=e381]:
          - listitem [ref=e382]: Complete authentication in your browser and copy the authorization code.
        - img "Copy authorization code" [ref=e384]
        - list [ref=e386]:
          - listitem [ref=e387]:
            - generic [ref=e388]:
              - text: Paste the code back into the settings panel and click
              - strong [ref=e389]: Submit
              - text: .
        - img "Paste auth code" [ref=e391]
        - paragraph [ref=e393]: Once authenticated, the server will reconnect automatically.
        - img "Authenticated server" [ref=e395]
        - paragraph [ref=e397]:
          - text: Access tokens are stored in
          - code [ref=e398]: ~/.gemini/antigravity/mcp_oauth_tokens.json
          - text: . Expired tokens are refreshed automatically, and invalid tokens are removed.
        - heading "Custom Headers" [level=3] [ref=e400]
        - paragraph [ref=e402]:
          - text: For servers that require custom HTTP headers (e.g. API keys or bearer tokens), add them to the
          - code [ref=e403]: headers
          - text: "object. For example:"
        - generic [ref=e406]:
          - generic [ref=e408]: json
          - button "content_copy" [ref=e409] [cursor=pointer]
          - code [ref=e412]: "{ \"mcpServers\": { \"my-remote-server\": { \"serverUrl\": \"https://api.example.com/mcp/\", \"headers\": { \"Authorization\": \"Bearer YOUR_API_TOKEN\" } } } }"
        - heading "Supported Servers" [level=2] [ref=e414]
