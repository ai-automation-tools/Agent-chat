name: CI

# Cheap smoke gate on every push / PR: install pinned deps, confirm the
# modules import + compile, validate the tracked configs, and run the test
# suites. Runs on Windows because requirements.txt pins pywin32 (the project
# is Windows-first; the Linux Fly image strips pywin32 separately in its
# Dockerfile, so a Linux CI runner can't `pip install -r requirements.txt`).

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Import smoke test
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import agent_chat_mcp, web_ui, inspect_conversations, start_conversation; from orchestrator import seeding, preflight, personas; print('imports OK')"

      - name: Compile all sources
        run: python -m compileall -q src scripts tests

      - name: Validate tracked JSON configs
        run: |
          $configs = @(
            'agents/CLIs/antigravity_agent1/.agents/mcp_config.json',
            'agents/CLIs/opencode_agent1/opencode.json'
          )
          foreach ($c in $configs) {
            python -m json.tool $c > $null
            if ($LASTEXITCODE -ne 0) { Write-Error "Invalid JSON: $c"; exit 1 }
            Write-Host "OK   $c"
          }

      - name: Validate fly.toml
        run: python -c "import tomllib; tomllib.load(open('fly.toml','rb')); print('OK   fly.toml')"

      - name: Run test suites
        # Globbed, not listed: every file in tests/ is standalone-runnable by
        # convention, and an explicit list silently drops new suites (it was
        # still naming two of six when test_persona_avatars.py landed).
        run: |
          $failed = @()
          Get-ChildItem tests/test_*.py | ForEach-Object {
            Write-Host "=== $($_.Name) ==="
            python $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $_.Name }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failing suites: $($failed -join ', ')"
            exit 1
          }
