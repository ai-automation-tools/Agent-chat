# Dependency updates. Minor/patch bumps arrive as one grouped PR per ecosystem per week;
# major versions are ignored (2026-09-29): the biweekly upstream check flags a major that
# breaks something, and Dependabot security alerts still fire for any version.
# Semantic upstream drift (MCP spec, CLI config) is the Agent-Chat
# Upstream Check routine's job -- see docs/UPSTREAMS.md.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # pydantic pins pydantic-core exactly. Bumped on its own, it breaks the install
      # (2026-09-29: pydantic 2.13.5 needs core 2.46.5, Dependabot picked 2.49.0). When a
      # pydantic bump fails CI on this, set pydantic_core to the version pydantic requires.
      - dependency-name: "pydantic-core"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
